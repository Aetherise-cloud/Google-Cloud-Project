<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &mdash; Spark Unified MCP Gateway v3.0</title>
  {{template "styles" .}}
</head>
<body>
  <div class="auth-container">
    <div class="card" style="text-align: center;">
      <div style="display: flex; justify-content: center; margin-bottom: 16px;">
        <div class="brand-logo" style="width: 48px; height: 48px; font-size: 1.5rem;">S</div>
      </div>
      <h1>Spark Unified MCP Gateway v3.0</h1>
      <p style="margin-bottom: 24px;">Admin Control Plane</p>

      {{if .ErrorMessage}}
      <div class="alert alert-error" role="alert" style="text-align: left;">
        <span>{{.ErrorMessage}}</span>
      </div>
      {{end}}

      <div style="margin-bottom: 8px;">
        <a href="/auth/google/login?return_to={{urlquery .ReturnTo}}" class="btn btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24" style="vertical-align: middle;">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Sign in with Google OIDC
        </a>
      </div>

      {{if .DevMode}}
      <div class="dev-mode-divider">
        <span>DEV MODE</span>
      </div>
      <div class="dev-mode-section">
        <div class="dev-badge">Local Dev Mode Sign-In</div>
        <p class="dev-desc">Local development bypass &mdash; active in DevMode only</p>
        <form method="POST" action="/auth/dev/login" style="text-align: left;">
          <input type="hidden" name="return_to" value="{{.ReturnTo}}">
          <div class="form-group">
            <label for="dev-email">Developer Email</label>
            <input type="email" id="dev-email" name="email" placeholder="developer@spark.local" required class="form-input">
          </div>
          <button type="submit" class="btn btn-secondary" style="width: 100%;">Sign In (Dev)</button>
        </form>
      </div>
      {{end}}
    </div>
  </div>
</body>
</html>
