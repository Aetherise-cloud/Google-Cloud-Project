{{define "styles"}}
<style>
  :root {
    --bg-main: #0a0e1a;
    --bg-card: #121929;
    --bg-card-hover: #182238;
    --bg-input: #090d16;
    --border-color: #232f48;
    --border-focus: #3b82f6;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #38bdf8;
    --success: #10b981;
    --success-bg: #064e3b;
    --success-border: #059669;
    --warning: #f59e0b;
    --warning-bg: #451a03;
    --warning-border: #b45309;
    --danger: #ef4444;
    --danger-bg: #450a0a;
    --danger-border: #b91c1c;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border-color);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--font-sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  a {
    color: var(--primary-light);
    text-decoration: none;
    transition: color 0.15s ease;
  }

  a:hover {
    color: #60a5fa;
    text-decoration: underline;
  }

  /* Containers */
  .container {
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  .auth-container {
    max-width: 480px;
    margin: auto;
    padding: 40px 20px;
    width: 100%;
  }

  .consent-container {
    max-width: 760px;
    margin: 32px auto;
    padding: 0 20px;
    width: 100%;
  }

  /* Cards */
  .card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 28px;
    margin-bottom: 24px;
  }

  /* Headings & Text */
  h1, h2, h3, h4 {
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }

  h1 { font-size: 1.75rem; margin-bottom: 8px; }
  h2 { font-size: 1.35rem; margin-bottom: 16px; }
  h3 { font-size: 1.1rem; margin-bottom: 8px; }
  p { color: var(--text-secondary); font-size: 0.95rem; }

  .text-muted { color: var(--text-muted); font-size: 0.85rem; }
  .text-mono { font-family: var(--font-mono); }

  /* Navigation / App Header */
  .app-header {
    background-color: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    padding: 16px 24px;
  }

  .app-header-content {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.1rem;
    color: white;
  }

  .brand-title {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text-primary);
  }

  .brand-subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .user-nav {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .user-badge {
    background: #1e293b;
    border: 1px solid var(--border-color);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 18px;
    font-size: 0.92rem;
    font-weight: 500;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
    line-height: 1.2;
  }

  .btn-sm {
    padding: 6px 12px;
    font-size: 0.82rem;
  }

  .btn-lg {
    padding: 12px 24px;
    font-size: 1rem;
    font-weight: 600;
  }

  .btn-primary {
    background-color: var(--primary);
    color: #ffffff;
    border-color: var(--primary);
  }

  .btn-primary:hover {
    background-color: var(--primary-hover);
    color: #ffffff;
    text-decoration: none;
  }

  .btn-outline {
    background-color: transparent;
    border-color: var(--border-color);
    color: var(--text-secondary);
  }

  .btn-outline:hover {
    background-color: var(--bg-card-hover);
    border-color: var(--text-secondary);
    color: var(--text-primary);
    text-decoration: none;
  }

  .btn-danger {
    background-color: transparent;
    border-color: var(--danger-border);
    color: #f87171;
  }

  .btn-danger:hover {
    background-color: var(--danger-bg);
    color: #fca5a5;
  }

  .btn-google {
    background-color: #ffffff;
    color: #1f2937;
    border-color: #e5e7eb;
    width: 100%;
    font-weight: 600;
    padding: 12px 18px;
  }

  .btn-google:hover {
    background-color: #f3f4f6;
    color: #111827;
    text-decoration: none;
  }

  .btn-secondary {
    background-color: #1e293b;
    border-color: #334155;
    color: var(--text-primary);
  }

  .btn-secondary:hover {
    background-color: #334155;
    text-decoration: none;
  }

  /* Forms & Inputs */
  .form-group {
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group label {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .form-input, .form-select {
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-size: 0.92rem;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s ease;
    font-family: inherit;
    width: 100%;
  }

  .form-input:focus, .form-select:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    font-size: 0.75rem;
    font-weight: 600;
    border-radius: 9999px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .badge-adc {
    background-color: #0c4a6e;
    color: #38bdf8;
    border: 1px solid #0284c7;
  }

  .badge-connected {
    background-color: var(--success-bg);
    color: var(--success);
    border: 1px solid var(--success-border);
  }

  .badge-disconnected {
    background-color: #1e293b;
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
  }

  .badge-readonly {
    background-color: #0369a1;
    color: #bae6fd;
    border: 1px solid #0284c7;
  }

  .badge-warning {
    background-color: var(--warning-bg);
    color: var(--warning);
    border: 1px solid var(--warning-border);
  }

  .badge-custom {
    background-color: #1e1b4b;
    color: #a5b4fc;
    border: 1px solid #4338ca;
  }

  /* Alerts */
  .alert {
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    font-size: 0.92rem;
    margin-bottom: 20px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .alert-error {
    background-color: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: #fca5a5;
  }

  .alert-success {
    background-color: var(--success-bg);
    border: 1px solid var(--success-border);
    color: #6ee7b7;
  }

  .alert-warning {
    background-color: var(--warning-bg);
    border: 1px solid var(--warning-border);
    color: #fcd34d;
  }

  /* Endpoint banner */
  .endpoint-banner {
    background: linear-gradient(180deg, #162035 0%, #101625 100%);
    border: 1px solid #283754;
    border-radius: var(--radius-md);
    padding: 20px;
    margin-bottom: 28px;
  }

  .endpoint-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .endpoint-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: #e2e8f0;
  }

  .endpoint-code-box {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .endpoint-code {
    flex: 1;
    min-width: 240px;
    background-color: #080d16;
    border: 1px solid #1f2c42;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-family: var(--font-mono);
    font-size: 0.88rem;
    color: #38bdf8;
    overflow-x: auto;
    white-space: nowrap;
  }

  /* 2x2 Connector Marketplace Grid */
  .marketplace-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  @media (max-width: 768px) {
    .marketplace-grid {
      grid-template-columns: 1fr;
    }
  }

  .connector-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  .connector-card:hover {
    border-color: #3b4d70;
  }

  .connector-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .connector-title-box {
    display: flex;
    flex-direction: column;
  }

  .connector-name {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-primary);
  }

  .connector-badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .connector-desc {
    color: var(--text-secondary);
    font-size: 0.88rem;
    margin-bottom: 16px;
    line-height: 1.45;
  }

  .connector-meta {
    background-color: #090e18;
    border: 1px solid #1d273d;
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 0.82rem;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .connector-meta-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .meta-label {
    color: var(--text-muted);
  }

  .meta-val {
    color: var(--text-secondary);
    font-family: var(--font-mono);
    word-break: break-all;
  }

  .connector-actions {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid #1b2437;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .scope-select-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.85rem;
  }

  .btn-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* Preset Radio Cards in Authorize */
  .preset-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }

  .preset-card {
    background-color: #0b111e;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .preset-card:hover {
    border-color: #3b82f6;
    background-color: #111a2d;
  }

  .preset-card input[type="radio"] {
    margin-top: 4px;
    accent-color: var(--primary);
    cursor: pointer;
  }

  .preset-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .preset-title {
    font-weight: 600;
    color: var(--text-primary);
    font-size: 0.95rem;
  }

  .preset-desc {
    color: var(--text-secondary);
    font-size: 0.85rem;
  }

  .scope-pills-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 24px;
    background-color: #090e18;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 18px;
  }

  @media (max-width: 640px) {
    .scope-pills-grid {
      grid-template-columns: 1fr;
    }
  }

  .scope-pill-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .scope-pill-label {
    font-weight: 500;
    font-size: 0.88rem;
    color: var(--text-primary);
  }

  /* Warning banner for DCR Client */
  .dcr-banner {
    background-color: #451a03;
    border: 1px solid #b45309;
    border-radius: var(--radius-md);
    padding: 14px 18px;
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .dcr-banner-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dcr-banner-text {
    color: #fde68a;
    font-size: 0.88rem;
  }

  /* Consent Client Details */
  .client-summary {
    background: #0d1524;
    border: 1px solid #1e2c45;
    border-radius: var(--radius-md);
    padding: 18px;
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 0.9rem;
  }

  .client-summary-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  .client-summary-label {
    color: var(--text-muted);
  }

  .client-summary-val {
    color: var(--text-primary);
    font-family: var(--font-mono);
    word-break: break-all;
  }

  /* Form actions footer */
  .consent-actions {
    display: flex;
    gap: 16px;
    justify-content: flex-end;
    margin-top: 24px;
  }

  @media (max-width: 480px) {
    .consent-actions {
      flex-direction: column;
    }
    .consent-actions .btn {
      width: 100%;
    }
  }

  /* Dev mode styling */
  .dev-mode-divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin: 24px 0;
    color: var(--text-muted);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.1em;
  }

  .dev-mode-divider::before,
  .dev-mode-divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--border-color);
  }

  .dev-mode-divider span {
    padding: 0 12px;
  }

  .dev-mode-section {
    background-color: #080d16;
    border: 1px dashed #334155;
    border-radius: var(--radius-md);
    padding: 20px;
  }

  .dev-badge {
    display: inline-block;
    background-color: #3b82f6;
    color: white;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  .dev-desc {
    font-size: 0.82rem;
    color: var(--text-secondary);
    margin-bottom: 14px;
  }

  /* Modals */
  .modal-backdrop {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(6, 10, 18, 0.82);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
  }

  .modal-backdrop.active {
    display: flex;
  }

  .modal-dialog {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.75);
    width: 100%;
    max-width: 680px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .modal-dialog-lg {
    max-width: 820px;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border-color);
    background-color: #101726;
  }

  .modal-title {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--text-primary);
  }

  .modal-close {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
    border-radius: 4px;
    transition: color 0.15s ease;
  }

  .modal-close:hover {
    color: var(--text-primary);
  }

  .modal-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    background-color: #0d1320;
    flex-wrap: wrap;
  }

  /* Tabs */
  .tab-bar {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 20px;
  }

  .tab-btn {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .tab-btn:hover {
    color: var(--text-primary);
  }

  .tab-btn.active {
    color: var(--primary-light);
    border-bottom-color: var(--primary);
    font-weight: 600;
  }

  .tab-pane {
    display: none;
  }

  .tab-pane.active {
    display: block;
  }

  /* Catalog Grid & Pills */
  .category-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .category-pill {
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .category-pill:hover {
    border-color: var(--primary);
    color: var(--text-primary);
  }

  .category-pill.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #ffffff;
  }

  .catalog-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  @media (max-width: 640px) {
    .catalog-grid {
      grid-template-columns: 1fr;
    }
  }

  .catalog-card {
    background-color: #0b111e;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 14px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
  }

  .catalog-card:hover {
    border-color: #3b82f6;
    background-color: #111a2d;
    transform: translateY(-1px);
  }

  .catalog-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background-color: #1e293b;
    border: 1px solid #334155;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--primary-light);
    flex-shrink: 0;
  }

  .catalog-info {
    flex: 1;
    min-width: 0;
  }

  .catalog-name {
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .catalog-desc {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-top: 3px;
    line-height: 1.35;
  }

  .catalog-action {
    margin-top: 8px;
    font-size: 0.78rem;
    color: var(--primary-light);
    font-weight: 500;
  }

  /* Tutorial steps */
  .tutorial-steps {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 20px;
  }

  .tutorial-step {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .step-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background-color: var(--primary);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .step-body {
    flex: 1;
  }
